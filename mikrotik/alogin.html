<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Wi-Fi connected</title>
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <main>
    <h1>You're connected</h1>
    <p>Continue browsing or <a href="/status">view your Wi-Fi status</a>.</p>
    <span id="redirect" data-destination="$(link-redirect-esc)" hidden></span>
  </main>
  <script src="hotspot.js"></script>
  <script>
    const destination = window.Hotspot?.destination(document.getElementById("redirect").dataset.destination);
    if (destination) location.replace(destination);
  </script>
</body>
</html>
