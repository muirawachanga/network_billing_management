<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Wi-Fi signed out</title>
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <main>
    <section id="portal-banners" class="banner-section" aria-labelledby="banner-title" hidden>
      <h2 id="banner-title">Featured</h2>
      <div id="banner-tiles" class="banner-track"></div>
      <div id="banner-dots" class="banner-dots" role="group" aria-label="Featured items" hidden></div>
    </section>
    <section class="tile" aria-labelledby="logout-title">
      <h2 id="logout-title">Signed out</h2>
      <p>Session time: $(uptime)</p>
      <p>Data uploaded / downloaded: $(bytes-in-nice) / $(bytes-out-nice)</p>
      <a href="/login" class="button">Return to Wi-Fi sign-in</a>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="banners.js"></script>
  <script>window.HotspotBanners?.preview();</script>
</body>
</html>
